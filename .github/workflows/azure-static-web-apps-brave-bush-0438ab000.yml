name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - v2-login
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - v2-login

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Inject client app config (keep app key out of repo)
        if: ${{ secrets.APP_CLIENT_KEY != '' }}
        shell: bash
        run: |
          printf '{"APP_API_KEY":"%s"}\n' "${{ secrets.APP_CLIENT_KEY }}" > app-config.json
      - name: Build And Deploy
        id: builddeploy
        shell: bash
        run: |
          echo "DIAGNOSTIC: SWA deploy step replaced to localize fault"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        shell: bash
        run: |
          echo "DIAGNOSTIC: close_pull_request_job also trivialized"
