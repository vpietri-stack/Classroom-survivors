name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - v2-login
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - v2-login

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Inject client app config (keep app key out of repo)
        if: ${{ secrets.APP_CLIENT_KEY != '' }}
        shell: bash
        run: |
          printf '{"APP_API_KEY":"%s"}\n' "${{ secrets.APP_CLIENT_KEY }}" > app-config.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BUSH_0438AB000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "/"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BUSH_0438AB000 }}
          action: "close"
