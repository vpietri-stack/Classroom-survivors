name: upload-test
on:
  push:
    branches: [main]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BUSH_0438AB000 }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "/"
