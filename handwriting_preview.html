<body class="kid-friendly hw-preview"><main><header><span class="preview-label">手写练习 · 测试预览</span><h1>写得自然，练得轻松</h1><p>先自己试着写。认不出来时会保留笔迹；试写两次后可查看提示。</p><p class="preview-note">这是测试页，不会上传笔迹或保存学习进度。</p><button id="preview-start" class="game-btn">开始练习</button><p id="model-status" role="status">正在准备手写识别…</p></header>

<section id="preview-summary" hidden><h2>练习完成</h2><p id="preview-results"></p><button id="preview-again" class="game-btn">再试一次</button></section></main>
